<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utleie – Marhaugengård</title>

<style>
:root{
  --green:#4a6b4f;
  --green-dark:#2f4033;
  --bg:#f7f8f5;
}

body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:var(--bg);
  color:#333;
}

/* HEADER */
.header{
  background:var(--green);
  color:white;
  text-align:center;
  padding:60px 20px;
}

.header h1{
  margin:0;
  font-size:2.2rem;
}

/* GRID */
.container{
  max-width:1100px;
  margin:auto;
  padding:70px 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:40px;
}

/* CARD */
.card{
  text-decoration:none;
  color:inherit;
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  transition:0.35s ease;
  display:block;
}

.card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 45px rgba(0,0,0,0.12);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:25px;
}

.card h2{
  margin:0 0 10px 0;
  color:var(--green);
}

.price{
  font-weight:bold;
  font-size:1.1rem;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="header">
  <h1>Utleie</h1>
  <p>Maskiner og utstyr tilgjengelig for gårdsarbeid og prosjekter</p>
</div>

<div class="container">
  <div class="grid">

    <a href="rensemaskin.html" class="card">
      <img src="rensemaskin1.jpg" alt="Rensemaskin">
      <div class="card-content">
        <h2>Rensemaskin</h2>
        <p>Kraftig rensemaskin for tepper og møbler.</p>
        <div class="price">300 kr per døgn</div>
      </div>
    </a>

    <a href="jordfres.html" class="card">
      <img src="jordfres1.jpg" alt="Jordfres">
      <div class="card-content">
        <h2>Jordfres</h2>
        <p>Effektiv jordfres for hage og mindre arbeid.</p>
        <div class="price">500 kr per døgn</div>
      </div>
    </a>

  </div>
</div>

</body>
</html>
